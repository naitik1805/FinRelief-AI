# render.yaml — Render Blueprint for FinRelief AI
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO USE:
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com/ -> New -> Blueprint
# 3. Connect your repo -- Render will auto-detect this file
# 4. Fill in the secret env vars (GOOGLE_API_KEY, SECRET_KEY) in the dashboard

services:
  # ─── Backend: FastAPI ───────────────────────────────────────────────────
  - type: web
    name: finrelief-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false        # paste your Gemini API key in Render dashboard
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: DATABASE_URL
        value: "sqlite:///./finrelief.db"
      - key: ALLOWED_ORIGINS
        # Set this AFTER frontend deploys. Format: https://finrelief-frontend.onrender.com
        sync: false

  # ─── Frontend: Vite/React Static Site ───────────────────────────────────
  - type: web
    name: finrelief-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      # SPA fallback: all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Set this to your backend URL: https://finrelief-backend.onrender.com
        sync: false
